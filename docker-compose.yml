# ═══════════════════════════════════════════════════════
# Token Relay Station v2 — Hybrid Architecture
#
# frontend (Hono) :3000  → Beautiful Chinese UI
# new-api   (Go)  :3001  → API Gateway + Admin Panel
# postgres  :5432         → Production Database
# redis     :6379         → Cache & Sessions
# ═══════════════════════════════════════════════════════

services:
  # ═══ Frontend — Chinese Landing Page ═══════════════════
  frontend:
    build: ./frontend
    container_name: token-relay-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NEW_API_URL=http://new-api:3000
      - TZ=Asia/Shanghai
    depends_on:
      - new-api
    # Tell Zeabur this is the public-facing service
    labels:
      - "zeabur.app/public=true"

  # ═══ Core: New API Gateway ═════════════════════════════
  new-api:
    image: calciumion/new-api:latest
    container_name: token-relay-gateway
    restart: always
    command: --log-dir /app/logs --port 3000
    # new-api doesn't need public port — frontend proxies to it internally
    expose:
      - "3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      # PostgreSQL
      - SQL_DSN=postgresql://tokenrelay:${DB_PASSWORD:-changeMe123}@postgres:5432/tokenrelay
      # Redis
      - REDIS_CONN_STRING=redis://redis
      # Timezone
      - TZ=Asia/Shanghai
      # Security — CHANGE THESE!
      - SESSION_SECRET=${SESSION_SECRET:-change-me-to-random-string}
      - CRYPTO_SECRET=${CRYPTO_SECRET:-change-me-to-random-string}
      # Streaming
      - STREAMING_TIMEOUT=600
      - STREAM_SCANNER_MAX_BUFFER_MB=128
      - MAX_REQUEST_BODY_MB=64
      # Features
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      # Auto-create initial root user
      - INITIAL_ROOT_TOKEN=${ADMIN_KEY:-admin-initial-key}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ═══ PostgreSQL ════════════════════════════════════════
  postgres:
    image: postgres:15-alpine
    container_name: token-relay-db
    restart: always
    environment:
      - POSTGRES_USER=tokenrelay
      - POSTGRES_PASSWORD=${DB_PASSWORD:-changeMe123}
      - POSTGRES_DB=tokenrelay
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokenrelay"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══ Redis ════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: token-relay-cache
    restart: always
    volumes:
      - ./redis_data:/data
